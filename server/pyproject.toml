[project]
name = "udyana-api"
version = "1.0.0"
description = "UDYANA ERP API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg>=0.30.0",
    "alembic==1.15.2",
    "python-jose[cryptography]==3.4.0",
    "bcrypt==4.3.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.1.0",
    "aiosqlite==0.21.0",
]

[project.scripts]
serve = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"
